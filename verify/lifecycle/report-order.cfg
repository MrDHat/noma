\* A workspace left running settles even when a pod goes (crash, or stop then start) with a report in flight.
SPECIFICATION FairSpec
CONSTANTS
    Reconcilers = {r1}
    KubeCanFail = FALSE
    MaxCrashes = 1
    MaxStops = 1
    SetupCanFail = FALSE
    MaxListChanges = 0
PROPERTIES SettlesReadyOrError
CHECK_DEADLOCK FALSE
