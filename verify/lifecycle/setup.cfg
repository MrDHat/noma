\* noma.yaml setup: ready only after it succeeded, a failure shows until a restart, a changed list runs again.
SPECIFICATION Spec
CONSTANTS
    Reconcilers = {r1}
    KubeCanFail = TRUE
    MaxCrashes = 1
    MaxStops = 1
    SetupCanFail = TRUE
    MaxListChanges = 1
INVARIANTS TypeOK ReadyMeansSetUp AgentPhaseKept ErrorClears
CHECK_DEADLOCK FALSE
