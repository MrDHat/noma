name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - name: Check for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: make test
      - run: make build
      - run: ./bin/noma version && ./bin/noma-server version && ./bin/noma-agent version

  # Noma's development image (build/dev.Dockerfile): it builds, and Noma's own
  # unit tests and lint pass inside it, as they will in a workspace.
  dev-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t noma-dev - <build/dev.Dockerfile
      - name: Build, test and lint Noma inside the image
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src -e HOME=/tmp/home -e GOFLAGS=-buildvcs=false noma-dev sh -euc '
            go version && golangci-lint version && gh --version && rg --version && jq --version
            make test
            golangci-lint run ./...'

  # The TLA+ model of the workspace lifecycle, and a check that the code it
  # covers has not changed since someone last confirmed the model matches it.
  lifecycle-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The sync check names the last commit that confirmed the model.
          fetch-depth: 0
      - run: make verify-lifecycle
      - run: hack/model-sync.sh lifecycle check

  # The same for the model of a changed secret reaching running workspaces.
  credentials-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The sync check names the last commit that confirmed the model.
          fetch-depth: 0
      - run: make verify-credentials
      - run: hack/model-sync.sh credentials check

  # The same for the model of taking an install down (M3.5).
  teardown-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The sync check names the last commit that confirmed the model.
          fetch-depth: 0
      - run: make verify-teardown
      - run: hack/model-sync.sh teardown check

  # The Noma chart lints and renders with each values file (M3.5-24).
  chart:
    runs-on: ubuntu-latest
    env:
      HELM_VERSION: v4.2.0
      HELM_SHA256: 97dbeb971be4ac4b27e3839976d9564c0fb35c6f3b1da89dd1e292d236af4096
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install helm
        run: |
          curl -fsSLo helm.tgz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tgz" | sha256sum -c -
          tar -xzf helm.tgz linux-amd64/helm
          sudo install linux-amd64/helm /usr/local/bin/
          rm -rf helm.tgz linux-amd64
      - run: helm lint --strict charts/noma
      - run: helm lint --strict charts/noma -f charts/noma/values-minikube.yaml
      - run: helm template noma charts/noma -n noma-system >/dev/null

  # The AWS Terraform: formatted, valid, and no HIGH or CRITICAL
  # misconfiguration beyond the accepted ones in .trivyignore (M3.5-24).
  # No AWS credentials here; EKS runs are manual acceptance.
  infra:
    runs-on: ubuntu-latest
    env:
      TERRAFORM_VERSION: 1.16.7
      TERRAFORM_SHA256: 5454efcf7fc87f0c2113111b9a5c7182f0ca1c6f0f23a1e110a50770a8fe473b
      TRIVY_VERSION: 0.76.1
      TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install terraform and trivy
        run: |
          curl -fsSLo terraform.zip "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          echo "${TERRAFORM_SHA256}  terraform.zip" | sha256sum -c -
          curl -fsSLo trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum -c -
          unzip -q terraform.zip terraform
          tar -xzf trivy.tgz trivy
          sudo install terraform trivy /usr/local/bin/
          rm -f terraform.zip trivy.tgz terraform trivy
      - run: terraform fmt -check -recursive infra
      - name: terraform validate
        run: |
          for dir in infra/aws/bootstrap infra/aws; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done
      - run: trivy config --skip-version-check --skip-dirs '**/.terraform' --severity HIGH,CRITICAL --exit-code 1 infra

  e2e:
    runs-on: ubuntu-latest
    env:
      MINIKUBE_VERSION: v1.38.1
      MINIKUBE_SHA256: 099477eaf248bcb5bcea8ce78a2898e93ac01461c35189da1848c3de82ecd22e
      KUBECTL_VERSION: v1.35.1
      KUBECTL_SHA256: 36e2f4ac66259232341dd7866952d64a958846470f6a9a6a813b9117bd965207
      HELM_VERSION: v4.2.0
      HELM_SHA256: 97dbeb971be4ac4b27e3839976d9564c0fb35c6f3b1da89dd1e292d236af4096
      # CI can't sign in to Claude, so workspaces get a fake claude binary.
      NOMA_CLAUDE: fake
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install minikube, kubectl and helm
        run: |
          curl -fsSLo helm.tgz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tgz" | sha256sum -c -
          tar -xzf helm.tgz linux-amd64/helm
          sudo install linux-amd64/helm /usr/local/bin/
          rm -rf helm.tgz linux-amd64
          curl -fsSLo minikube "https://github.com/kubernetes/minikube/releases/download/${MINIKUBE_VERSION}/minikube-linux-amd64"
          echo "${MINIKUBE_SHA256}  minikube" | sha256sum -c -
          curl -fsSLo kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  kubectl" | sha256sum -c -
          sudo install minikube kubectl /usr/local/bin/
          rm minikube kubectl
      - run: make dev-up
      - run: make e2e
      # Last, because it ends the install: helm uninstall's guard passes once
      # no workspaces are left, and creates are refused from then on.
      - run: go test -tags e2e -count=1 -v -run TestUninstallClosesTheInstall ./test/e2e/
        env:
          NOMA_E2E_UNINSTALL: "1"
      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl --context noma get pods -A -o wide || true
          kubectl --context noma get events -A --sort-by=.lastTimestamp | tail -50 || true
