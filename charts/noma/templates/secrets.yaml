{{- if .Values.secrets.create }}
{{- $ns := .Release.Namespace }}
{{- $pgPassword := include "noma.keep" (dict "ns" $ns "name" "postgres" "key" "password" "default" (randAlphaNum 48)) }}
apiVersion: v1
kind: Secret
metadata:
  name: postgres
  labels: {{- include "noma.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  password: {{ $pgPassword }}
---
{{- $url := printf "postgres://noma:%s@postgres.%s:5432/noma?sslmode=disable" ($pgPassword | b64dec) $ns }}
apiVersion: v1
kind: Secret
metadata:
  name: noma-server
  labels: {{- include "noma.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  database-url: {{ include "noma.keep" (dict "ns" $ns "name" "noma-server" "key" "database-url" "default" $url) }}
  admin-token: {{ include "noma.keep" (dict "ns" $ns "name" "noma-server" "key" "admin-token" "default" (randAlphaNum 64)) }}
---
# Seals stored secrets (M3-12); rows record the key ID. Regenerating it
# would make every stored secret unreadable, so it is kept.
apiVersion: v1
kind: Secret
metadata:
  name: noma-secret-key
  labels: {{- include "noma.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  id: {{ include "noma.keep" (dict "ns" $ns "name" "noma-secret-key" "key" "id" "default" "k1") }}
  key: {{ include "noma.keep" (dict "ns" $ns "name" "noma-secret-key" "key" "key" "default" (randBytes 32)) }}
---
{{- /* The agent endpoint's certificate, from a CA only workspaces trust. */}}
{{- $tls := lookup "v1" "Secret" $ns "noma-server-tls" }}
apiVersion: v1
kind: Secret
metadata:
  name: noma-server-tls
  labels: {{- include "noma.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: kubernetes.io/tls
data:
{{- if $tls }}
  tls.crt: {{ index $tls.data "tls.crt" }}
  tls.key: {{ index $tls.data "tls.key" }}
  ca.crt: {{ index $tls.data "ca.crt" }}
{{- else }}
{{- $ca := genCA "Noma agent CA" 3650 }}
{{- $dns := list (printf "noma-server.%s.svc" $ns) (printf "noma-server.%s.svc.cluster.local" $ns) "localhost" }}
{{- $cert := genSignedCert "noma-server" nil $dns 3650 $ca }}
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
  ca.crt: {{ $ca.Cert | b64enc }}
{{- end }}
{{- end }}
