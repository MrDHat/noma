apiVersion: v1
kind: ServiceAccount
metadata:
  name: noma-server
  labels: {{- include "noma.labels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: noma-server
  labels: {{- include "noma.labels" . | nindent 4 }}
spec:
  selector:
    app: noma-server
  ports:
    - name: api
      port: 8080
    - name: agents
      port: 8443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: noma-server
  labels: {{- include "noma.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: noma-server
  template:
    metadata:
      labels:
        app: noma-server
    spec:
      serviceAccountName: noma-server
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: {{ .Values.server.image }}
          imagePullPolicy: {{ .Values.server.pullPolicy }}
          env:
            - name: NOMA_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: noma-server
                  key: database-url
            - name: NOMA_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: noma-server
                  key: admin-token
            # Seals stored secrets (M3-12); rows record the key ID.
            - name: NOMA_SECRET_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: noma-secret-key
                  key: id
            - name: NOMA_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: noma-secret-key
                  key: key
            - name: NOMA_AGENT_URL
              value: https://noma-server.{{ .Release.Namespace }}.svc:8443
            - name: NOMA_WORKSPACE_IMAGE
              value: {{ .Values.workspace.image }}
            - name: NOMA_WORKSPACE_MEMORY
              value: {{ .Values.workspace.memory | quote }}
            - name: NOMA_FAKE_CLAUDE
              value: {{ ternary "1" "0" .Values.workspace.fakeClaude | quote }}
          ports:
            - containerPort: 8080
            - containerPort: 8443
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 2
          volumeMounts:
            - name: tls
              mountPath: /etc/noma/tls
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tls
          secret:
            secretName: noma-server-tls
