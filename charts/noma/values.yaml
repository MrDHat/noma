# Noma installs into one namespace per cluster (noma-system): its names are
# fixed, and workspaces reach noma-server at noma-server.noma-system.svc.
# The cluster must already have the gvisor RuntimeClass and NetworkPolicy
# enforcement (M3.5-15).

server:
  image: noma-server:dev
  pullPolicy: IfNotPresent

workspace:
  # The image every workspace starts on (it clones the repo).
  image: noma-workspace:dev
  # Each workspace container's requests and limits (M3.5-7).
  resources:
    requests:
      memory: 512Mi
      cpu: 100m
    limits:
      memory: 3Gi
      cpu: "2"
  # Each workspace volume's size, and its StorageClass ("" is the cluster's
  # default). Both apply to new workspaces only (M3.5-23).
  disk: 20Gi
  # The gVisor RuntimeClass workspaces run under. The cluster provides it;
  # the preflight check fails the install without it (M3.5-15).
  runtimeClassName: gvisor
  storageClassName: ""
  # Use the fake claude binary baked into the workspace image (tests only).
  fakeClaude: false

# Each user's Claude login, which all their workspaces mount. Use
# ReadWriteMany (EFS on EKS) when workspaces run on more than one node
# (M3.5-20). Applies to users who have no login claim yet.
login:
  storageClassName: ""
  accessMode: ReadWriteOnce

postgres:
  # postgres:17-alpine, multi-arch index.
  image: postgres:17-alpine@sha256:e5d2edd28b1f8d40a0a6c0c9cdc545b19b56a0d5d88f94bc11a97d970d4700d0
  storage: 1Gi
  # Empty means the cluster's default StorageClass.
  storageClassName: ""

# The chart creates Noma's secrets once and keeps them across upgrades and
# uninstall (M3.5-16): postgres, noma-server, noma-secret-key and
# noma-server-tls in the release namespace. Set create to false when they
# exist already, for example when rendering without a cluster.
secrets:
  create: true

# Check the cluster has what Noma needs before every install and upgrade.
preflight:
  enabled: true
