# What noma-server may do in the cluster. No exec, no Secrets, no RBAC.
# M2 grants this cluster-wide because user namespaces are created on demand;
# admission rules that confine it to noma-u-* namespaces come in M5.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: noma-server
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch, create, patch]
  - apiGroups: [""]
    resources: [serviceaccounts, persistentvolumeclaims]
    verbs: [get, list, watch, create, patch, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [get, list, watch, create, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: noma-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: noma-server
subjects:
  - kind: ServiceAccount
    name: noma-server
    namespace: noma-system
